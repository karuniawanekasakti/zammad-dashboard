name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The frontend self-checks run under --experimental-strip-types (Node >= 22.6).
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm run check:frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Python syntax check
        run: python -m compileall backend/app
      - name: Unit tests
        run: python backend/tests/run.py unit
      - name: Deploy-artifact consistency check
        run: python deploy/check_deploy_files.py
      - name: Build backend Docker image
        run: docker build ./backend
