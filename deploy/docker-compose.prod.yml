x-prod-backend-env: &prod-backend-env
  env_file:
    - ../.env
  environment:
    ZAMMAD_BASE_URL: "${ZAMMAD_BASE_URL:?set ZAMMAD_BASE_URL in .env}"
    ZAMMAD_API_TOKEN: "${ZAMMAD_API_TOKEN:?set ZAMMAD_API_TOKEN in .env}"
    ZAMMAD_WEBHOOK_SECRET: "${ZAMMAD_WEBHOOK_SECRET:?set ZAMMAD_WEBHOOK_SECRET in .env}"
    REDIS_URL: "${REDIS_URL:?set REDIS_URL in .env}"
    DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env}"
    JWT_SECRET_KEY: "${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}"
    JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-8}"
    CORS_ORIGINS: "${CORS_ORIGINS:-[]}"

services:
  api:
    <<: *prod-backend-env
    ports: !reset []

  worker:
    <<: *prod-backend-env

  beat:
    <<: *prod-backend-env

  db:
    environment:
      POSTGRES_DB: "zammad_dashboard"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    ports: !reset []

  redis:
    command: redis-server --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports: !reset []

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_USE_BACKEND: "true"
        VITE_API_BASE: "${VITE_API_BASE:-/api/v1}"
        VITE_WS_BASE: "${VITE_WS_BASE:-}"
    ports:
      - "${DEPLOY_BIND_HOST:-127.0.0.1}:${DEPLOY_HTTP_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
