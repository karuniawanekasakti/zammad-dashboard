name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python -m compileall backend/app
      - name: Deploy-artifact consistency check
        run: python deploy/check_deploy_files.py
      - name: Build backend Docker image
        run: docker build ./backend
